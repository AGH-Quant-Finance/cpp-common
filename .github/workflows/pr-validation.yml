name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared configurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^\[(MAJOR|MINOR|PATCH)\]([[:space:]]|$) ]]; then
            echo "Use a [MAJOR], [MINOR], or [PATCH] prefix followed by a space."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate in the shared toolchain
        run: |
          docker run --rm --network none --volume "$PWD:/workspace:ro" --workdir /workspace ghcr.io/agh-quant-finance/cpp-toolchain-image:0.1.3 bash scripts/validate.sh
